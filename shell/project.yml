# Generate the Xcode project with: xcodegen
name: SemanticCanvas
options:
  bundleIdPrefix: dev.frwd
  deploymentTarget:
    iOS: "17.0"
packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: 0.20.0
targets:
  SemanticCanvas:
    type: application
    platform: iOS
    sources:
      - path: SemanticCanvas
    dependencies:
      - package: FlyingFox
    info:
      path: SemanticCanvas/Info.plist
      properties:
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # Local Sessions: loopback WebSocket from the file://-loaded Canvas
        # and, later, serving Guests on the LAN (spec #24, spike #25).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XY3PBJHX4Y
        SWIFT_VERSION: "5.9"
